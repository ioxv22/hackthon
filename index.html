<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1c31">
  <meta name="description" content="AIGov Compass: From government use case to evidence-backed AI approval.">
  <title>AIGov Compass — Responsible AI, made actionable</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="overview" aria-label="AIGov Compass home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><b></b></span>
        <span><strong>AIGov</strong><small>COMPASS</small></span>
      </a>
      <div class="side-label" id="workspace-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-link active" data-page="overview"><span class="nav-icon">◫</span><span data-en="Overview" data-ar="نظرة عامة">Overview</span></button>
        <button class="nav-link" data-page="intake"><span class="nav-icon">＋</span><span data-en="Use-case intake" data-ar="استقبال حالة الاستخدام">Use-case intake</span><span class="nav-step">01</span></button>
        <button class="nav-link" data-page="registry"><span class="nav-icon">◈</span><span data-en="Model registry" data-ar="سجل النماذج">Model registry</span><span class="nav-step">02</span></button>
        <button class="nav-link" data-page="workspace"><span class="nav-icon">⌁</span><span data-en="Evaluation" data-ar="التقييم">Evaluation</span><span class="nav-step">03</span></button>
        <button class="nav-link" data-page="evidence"><span class="nav-icon">▤</span><span data-en="Evidence matrix" data-ar="مصفوفة الأدلة">Evidence matrix</span></button>
        <button class="nav-link" data-page="approval"><span class="nav-icon">✓</span><span data-en="Human review" data-ar="المراجعة البشرية">Human review</span></button>
        <button class="nav-link" data-page="readiness"><span class="nav-icon">⌂</span><span data-en="Deployment &amp; monitoring" data-ar="النشر والمراقبة">Deployment &amp; monitoring</span></button>
        <button class="nav-link" data-page="compare"><span class="nav-icon">⇄</span><span data-en="Live model comparison" data-ar="مقارنة النماذج المباشرة">Live model comparison</span><span class="nav-step">LIVE</span></button>
        <button class="nav-link" data-page="passport"><span class="nav-icon">▣</span><span data-en="Model passport" data-ar="جواز النموذج">Model passport</span></button>
        <button class="nav-link" data-page="value"><span class="nav-icon">◷</span><span data-en="Time-savings measure" data-ar="قياس توفير الوقت">Time-savings measure</span></button>
        <button class="nav-link" data-page="open-data"><span class="nav-icon">▦</span><span data-en="Open-data tests" data-ar="اختبارات البيانات المفتوحة">Open-data tests</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-link" data-page="pitch"><span class="nav-icon">▧</span><span data-en="Pitch &amp; 90-day plan" data-ar="العرض وخطة ٩٠ يوماً">Pitch &amp; 90-day plan</span></button>
        <button class="nav-link" data-page="project"><span class="nav-icon">ⓘ</span><span data-en="Project &amp; sources" data-ar="المشروع والمصادر">Project &amp; sources</span></button>
        <div class="side-note"><span class="live-dot"></span><span id="environment-label">DEMO ENVIRONMENT</span></div>
        <button class="reset-link" id="reset-demo">↻ <span data-en="Reset demo" data-ar="إعادة ضبط العرض">Reset demo</span></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="menu-toggle" aria-label="Toggle navigation">☰</button>
        <div class="breadcrumb"><span id="breadcrumb-label">Workspace</span><b>/</b><strong id="crumb-current">Overview</strong></div>
        <div class="top-actions">
          <span class="demo-chip" id="mode-chip"><span class="live-dot"></span> DEMO MODE · SIMULATED</span>
          <button class="icon-button" id="mode-toggle" type="button" title="Switch Demo or Live mode">Switch to Live</button>
          <button class="icon-button" id="guided-demo" title="Start judging demo"><span>▷</span> <span data-en="Start judging demo" data-ar="ابدأ عرض التحكيم">Start judging demo</span></button>
          <button class="language-button" id="language-toggle" aria-label="Switch language">عربي</button>
          <div class="avatar" title="Demo reviewer">AR</div>
        </div>
      </header>
      <section id="main-content" class="content" tabindex="-1"></section>
      <footer class="footer-note"><span id="footer-disclaimer">Prototype for demonstration only · No official endorsement, certification, or government approval</span><span id="footer-region">UAE · Responsible AI</span></footer>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="evaluation-rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
